# One-command hosting:  docker compose up --build
# Reads GEMINI_API_KEY from your shell env or a local .env file (compose auto-loads .env).
services:
  studio:
    build: .
    image: faceless-studio
    ports:
      - "8000:8000"
    environment:
      # REQUIRED — your Gemini API key (from https://aistudio.google.com/app/apikey)
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in your shell or a .env file}
      # OPTIONAL key pool: GEMINI_API_KEYS="key1,key2,key3" → round-robin to dodge
      # per-key rate limits. Keys must be from SEPARATE projects to multiply quota.
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      # How many videos render in parallel (≈ this × 2 concurrent Veo calls).
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-10}
      # FAST MODE: set SKIP_VEO=true to skip the slow Veo motion render and build
      # videos from Imagen keyframes + Ken Burns (~3x faster). Default off (full Veo).
      SKIP_VEO: ${SKIP_VEO:-false}
      # Faster/cheaper keyframes when in fast mode (ultra is slower, higher fidelity).
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-imagen-4.0-ultra-generate-001}
      # ── Curriculum bridge (education-portal integration) ──
      # Optional API key the portal must send as X-API-Key on /api/v1/videos calls.
      # Leave blank to keep the portal API open (fine for an internal host).
      PORTAL_API_KEY: ${PORTAL_API_KEY:-}
      # The portal's curriculum/scripts endpoint the bridge pulls from.
      PORTAL_API_URL: ${PORTAL_API_URL:-https://dextora.org/api/v1/curriculum/video-reel-scripts}
    volumes:
      # Persist generated videos + job history across restarts
      - ./output:/app/output
      # Optional: only needed if you switch Veo to a Vertex service account
      # - ./credentials:/app/credentials:ro
    restart: unless-stopped
